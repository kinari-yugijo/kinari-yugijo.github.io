<title>ChronoSlate Manual</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--ground:#ECEEF1;--ink:#1B1E24;--faint:#79818C;--amber:#A8641A}
body{margin:0;min-height:100vh;display:grid;place-content:center;gap:22px;text-align:center;
  background:var(--ground);color:var(--ink);font-family:system-ui,sans-serif;padding:24px}
h1{font-family:"Zen Old Mincho",serif;font-size:26px;margin:0;letter-spacing:.02em}
p{margin:0;color:var(--faint);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em}
nav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
a{color:var(--amber);text-decoration:none;border:1px solid var(--amber);padding:9px 22px;border-radius:3px;font-size:14px}
a:hover{background:var(--amber);color:var(--ground)}
a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
</style>
<h1>ChronoSlate</h1>
<p>MANUAL/説明書</p>
<nav>

  <a href="manual_en.html">English</a>

  var jp = (navigator.language || "").toLowerCase().indexOf("ja") === 0;
  location.replace(jp ? "manual_jp.html" : "manual_en.html");
